# Registre des jeux lançables depuis le Dashboard (phase P5).
# À copier en <game_data_root>/games.toml (ex. dashboards/2.0.6770.0/assets/games.toml).
# Lancer : F5 (manette : Back + Y) dans le Dashboard ouvre la liste ; ou --dash_launch=<TitleID> pour un test ;
# ou tout appel du Dashboard à XamLoaderLaunchTitle(Ex) (disque) pour le jeu `disc`.
# Le Dashboard quitte, le jeu s'exécute, puis le Dashboard est relancé (voir README, « Lancer des jeux »).

# Disque simulé : le jeu marqué `disc = true` (plus bas) apparaît comme disque inséré (bouton de disque de l'onglet
# Games : nom et icône du jeu, A le lance). Équivalents : --dash_disc=<TitleID>, ou `disc = "<TitleID>"` ici.
# Les appels XamLoaderLaunchTitle sans chemin lancent ce jeu (à défaut, le seul jeu déclaré).

# Jeux listés dans Games Library > My Games (contenu Arcade virtuel ; Play Game les lance).
library = true

[xenia]
# Commande Xenia pour les jeux `xenia = "..."` (--dash_xenia=... ou variable DASH_XENIA la remplacent).
command = "xenia_canary"

# [game.<TitleID hexadécimal>]
[game.45410813]
name = "Skate"
# Jeu recompilé en natif : commande shell lancée dans `cwd` (LD_LIBRARY_PATH du Dashboard est retiré de son
# environnement ; `keep_ld_library_path = true` pour le conserver).
native = "./skate1"
cwd = "../Skate1Recompiled/out/pc-profile"
type = "arcade"        # arcade (défaut), demo, original, xna ou un nombre
disc = true            # « inséré dans le lecteur »
# icon = "icones/skate.png"   # PNG <= 16 Ko ; sinon l'icône du <TitleID>.gpd du profil (ou `spa = "..."`)

[game.4D5307E6]
name = "Halo 3 (Xenia)"
# Jeu non recompilé : le XEX ou l'ISO est donné à la commande Xenia.
xenia = "/chemin/absolu/halo3.iso"
