    <rect x="32" y="32" width="88" height="56" rx="8"/><rect x="132" y="32" width="92" height="56" rx="8"/>
    <rect x="32" y="168" width="92" height="56" rx="8"/><rect x="136" y="168" width="88" height="56" rx="8"/>
